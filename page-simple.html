<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaarigar Connect</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0A0A0A 0%, #1A1612 50%, #2D1B0E 100%);
            min-height: 100vh;
            margin: 0;
        }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;
        
        const App = () => {
            const [page, setPage] = useState('welcome');
            
            return (
                <div className="min-h-screen flex items-center justify-center p-6">
                    <div className="max-w-md w-full bg-gray-900 bg-opacity-90 rounded-3xl p-12 text-center">
                        <div className="w-24 h-24 mx-auto mb-8 rounded-full bg-gradient-to-r from-amber-700 to-amber-500 flex items-center justify-center">
                            <span className="text-4xl">🪵</span>
                        </div>
                        
                        <h1 className="text-5xl font-serif font-bold text-white mb-4">
                            Kaarigar Connect
                        </h1>
                        <p className="text-gray-300 text-lg mb-12">
                            Premium Wood Carving Platform
                        </p>
                        
                        <div className="space-y-4">
                            <button 
                                onClick={() => alert('Onboarding coming soon!')}
                                className="w-full bg-gradient-to-r from-amber-700 to-amber-500 text-white py-5 rounded-2xl text-lg font-bold hover:scale-105 transition-transform"
                            >
                                Sign Up as Artisan
                            </button>
                            
                            <button 
                                onClick={() => alert('Client mode activated!')}
                                className="w-full bg-gray-800 text-gray-300 py-5 rounded-2xl text-lg font-bold hover:bg-gray-700 transition-colors"
                            >
                                Continue as Client
                            </button>
                        </div>
                        
                        <p className="text-gray-500 text-sm mt-8">
                            ✨ Connecting artisans with the world
                        </p>
                    </div>
                </div>
            );
        };
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
