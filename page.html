            height: 320px;
            border: 3px solid var(--accent-light);
            border-radius: 24px;
            overflow: hidden;
        }
        
        .scanner-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-light), transparent);
            animation: scan 2s linear infinite;
            box-shadow: 0 0 20px var(--accent-light);
        }
        
        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }
        
        .scanner-corners {
            position: absolute;
            inset: 0;
        }
        
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid var(--accent-light);
        }
        
        .corner-tl { top: 0; left: 0; border-right: none; border-bottom: none; }
        .corner-tr { top: 0; right: 0; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 0; left: 0; border-right: none; border-top: none; }
        .corner-br { bottom: 0; right: 0; border-left: none; border-top: none; }

            from { transform: translateX(-100%); }

</head>

                        return <OrdersPage />;
                    case 'order-detail':
                        return <OrderDetailPage />;
                    case 'profile':
                        return user?.type === 'artisan' ? <BentoDashboard /> : <ClientProfilePage />;
                    case 'artisan-settings':
                        return <ArtisanSettingsPage />;
                    case 'specialty-detail':
                        return <SpecialtyDetailPage />;
                    case 'cart':
                        return <CartPage />;
                    case 'checkout':
                        return <CheckoutPage />;
                    case 'order-confirmation':
                        return <OrderConfirmationPage />;
                    case 'blog-detail':
                        return <BlogDetailPage />;
                    default:
                        return <HomePage />;
                }
            };
            
            return (
                <div className="font-sans min-h-screen">
                    {renderPage()}
                    {isAuthenticated && <BottomNav />}
                    <CameraScanner />
                    <CommissionModal />
                    <Toast />
                </div>
            );
        };
        
        // Render App with error handling
        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
            
            // Initialize Lucide Icons after render
            setTimeout(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, 100);
        } catch (error) {
            console.error('Error rendering app:', error);
            document.getElementById('root').innerHTML = `
                <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0A0A0A 0%, #1A1612 50%, #2D1B0E 100%); padding: 20px;">
                    <div style="max-width: 500px; background: rgba(26, 22, 18, 0.95); padding: 40px; border-radius: 24px; text-align: center; color: white;">
                        <h2 style="font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 20px;">Kaarigar Connect</h2>
                        <p style="color: #E8E2D4; margin-bottom: 20px;">Loading application...</p>
                        <button onclick="location.reload()" style="background: linear-gradient(135deg, #8B4513 0%, #CD853F 100%); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer;">
                            Reload Page
                        </button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
